version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: waai_app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - waai_network
    volumes:
      - ./logs:/app/logs

  redis:
    image: redis:7-alpine
    container_name: waai_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - waai_network
    command: redis-server --appendonly yes

networks:
  waai_network:
    driver: bridge

volumes:
  redis_data:
