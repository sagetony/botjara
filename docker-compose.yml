version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: botjara_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - botjara_network
    volumes:
      - ./logs:/app/logs

  redis:
    image: redis:7-alpine
    container_name: botjara_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - botjara_network
    command: redis-server --appendonly yes

networks:
  botjara_network:
    driver: bridge

volumes:
  redis_data:
